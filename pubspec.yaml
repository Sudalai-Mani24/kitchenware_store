name: dhanalakshmi_cart_cart
description: "Dhanalakshmi Patthirakadai Inventory Management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  http: ^1.2.1
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#8D4925" # Copper background color
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/